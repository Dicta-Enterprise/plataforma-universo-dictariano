<!-- HEADER FIJO (Navbar + Barra de Categorías opcional) -->
<header class="fixed top-0 left-0 w-full z-50 bg-[#272727]">
  <!-- BARRA DE CATEGORÍAS (Visible solo sin autenticar) -->
  <div
    *ngIf="(auth.isLoggedIn$ | async) === false || searchVisible"
    class="flex items-center justify-center gap-3 h-12 bg-[#272727] border-b border-gray-700 w-full"
  >
    <!-- Padres -->
    <a
      routerLink="courses/padres"
      pRipple
      routerLinkActive="outline-transparent"
      #rla="routerLinkActive"
      [class]="
        !rla.isActive
          ? 'flex items-center gap-1 font-bold whitespace-nowrap px-3 py-1.5 rounded-[10px] w-[90px] justify-center bg-padre text-[#0a0a0a] transition duration-200'
          : 'flex items-center gap-1 font-medium whitespace-nowrap px-3 py-1.5 rounded-[10px] w-[90px] justify-center bg-white/5 text-gray-400 hover:text-cyan-400 outline outline-1 outline-gray-700 transition duration-200'
      "
      style="text-decoration: none"
    >
      <i class="pi pi-heart text-sm"></i>
      <span class="text-sm">Padres</span>
    </a>

    <span class="text-gray-600">|</span>

    <!-- Jóvenes -->
    <a
      routerLink="courses/jovenes"
      pRipple
      routerLinkActive="outline-transparent"
      #rlaJovenes="routerLinkActive"
      [class]="
        !rlaJovenes.isActive
          ? 'flex items-center gap-1 font-bold whitespace-nowrap px-3 py-1.5 rounded-[10px] w-[90px] justify-center bg-joven text-[#0a0a0a] transition duration-200'
          : 'flex items-center gap-1 font-medium whitespace-nowrap px-3 py-1.5 rounded-[10px] w-[90px] justify-center bg-white/5 text-gray-400 hover:text-yellow-400 outline outline-1 outline-gray-700 transition duration-200'
      "
      style="text-decoration: none"
    >
      <i class="pi pi-send text-sm"></i>
      <span class="text-sm">Jóvenes</span>
    </a>

    <span class="text-gray-600">|</span>

    <!-- Niños -->
    <a
      routerLink="/courses/ninos"
      pRipple
      routerLinkActive="outline-transparent"
      #rlaNinos="routerLinkActive"
      [class]="
        !rlaNinos.isActive
          ? 'flex items-center gap-1 font-bold whitespace-nowrap px-3 py-1.5 rounded-[10px] w-[90px] justify-center bg-nino text-[#0a0a0a] transition duration-200'
          : 'flex items-center gap-1 font-medium whitespace-nowrap px-3 py-1.5 rounded-[10px] w-[90px] justify-center bg-white/5 text-gray-400 hover:text-green-400 outline outline-1 outline-gray-700 transition duration-200'
      "
      style="text-decoration: none"
    >
      <i class="pi pi-star text-sm"></i>
      <span class="text-sm">Niños</span>
    </a>
  </div>

  <!-- Modal Barrra de Búsqueda Móvil -->
  <div
    *ngIf="searchVisible"
    class="flex items-center border-b border-gray-700 bg-[#272727] p-3 sm:hidden"
  >
    <!-- Contenedor del input con icono en posición absoluta -->
    <div class="relative w-full">
      <i
        class="pi pi-search text-joven absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none"
      ></i>
      <input
        type="text"
        pInputText
        placeholder="Buscar cursos..."
        [(ngModel)]="searchQuery"
        (keyup.enter)="buscar(); searchVisible = false"
        (blur)="searchVisible = false"
        class="w-full rounded-[10px] border border-[#5c5c5c] bg-[#3a3a3a] pl-10 pr-3 py-1 placeholder-gray-400 focus:outline-none focus:border-[#e8002e]"
      />
    </div>

    <!-- Botón de cerrar -->
    <button
      type="button"
      (click)="searchVisible = false"
      class="ml-2 cursor-pointer border-0 bg-transparent p-1 text-xl text-white focus:outline-none"
      aria-label="Cerrar búsqueda"
    >
      <i class="pi pi-times"></i>
    </button>
  </div>

  <!-- NAVBAR de abajo -->
  <div
    class="flex items-center justify-between px-4 gap-3 sm:gap-4 h-16 bg-[#272727] border-b border-gray-700"
    *ngIf="!searchVisible"
  >
    <!-- Logo -->
    <a
      routerLink="/"
      routerLinkActive="border-b-2 border-yellow-400 rounded-b"
      [routerLinkActiveOptions]="{ exact: true }"
      class="inline-block transition-all border-b-2 border-transparent"
    >
      <img
        src="https://res.cloudinary.com/djwspay9f/image/upload/q_auto/f_auto/v1781305419/Mesa_de_trabajo_1_mvh0bi.svg"
        alt="Logo Mundo Dictariano"
        class="h-10 w-auto object-contain"
      />
    </a>

    <!-- Link Mundo 3D -->
    <a
      *ngIf="(auth.isLoggedIn$ | async) === false"
      pRipple
      href="http://localhost:3000"
      target="_blank"
      class="hidden sm:flex items-center gap-2 px-3 py-2 text-gray-400 hover:text-yellow-400 font-medium transition duration-200"
    >
      <i class="pi pi-globe"></i>
      <span>Mundo 3D</span>
    </a>

    <!-- Barra de busqueda -->
    <div class="ml-auto flex items-center">
      <!-- Input de búsqueda para pantallas grandes -->
      <div class="relative hidden sm:block">
        <i
          class="pi pi-search text-joven absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none"
        ></i>

        <input
          type="text"
          pInputText
          placeholder="Buscar cursos..."
          [(ngModel)]="searchQuery"
          (keyup.enter)="buscar()"
          class="w-[260px] rounded-[10px] border border-[#5c5c5c] bg-[#3a3a3a] pl-10 pr-3 py-1 placeholder-gray-400 focus:outline-none focus:border-[#e8002e]"
        />
      </div>

      <!-- Botón para pantallas pequeñas (móvil) -->
      <button
        type="button"
        class="flex sm:hidden cursor-pointer bg-transparent border-0 p-0 focus:outline-none"
        (click)="searchVisible = !searchVisible"
        aria-label="Abrir búsqueda"
      >
        <i class="pi pi-search text-joven text-base"></i>
      </button>
    </div>

    <!-- Carrito: Solo se muestra si esta logeado y si tiene mas de un item -->
    <a
      *ngIf="(auth.isLoggedIn$ | async) === true && (countCart$ | async)! > 0"
      pRipple
      [routerLink]="['/cart']"
      class="relative flex items-center text-gray-400 hover:text-joven cursor-pointer"
    >
      <i class="pi pi-shopping-cart text-xl"></i>

      <!-- El badge con número solo aparece si hay más de 0 items -->
      <span
        *ngIf="(countCart$ | async)! > 0"
        class="absolute -top-1.5 -right-1.5 bg-nino text-black text-xs rounded-full px-2 py-0.5 font-bold"
      >
        {{ countCart$ | async }}
      </span>
    </a>

    <!-- Notificaciones -->
    <a
      pRipple
      [routerLink]="['/notificaciones']"
      *ngIf="auth.isLoggedIn$ | async"
      class="relative flex items-center text-gray-400 hover:text-joven cursor-pointer"
    >
      <i class="pi pi-bell text-xl"></i>
      <ng-container *ngIf="countNotifications$ | async as countNotifications">
        <span
          *ngIf="countNotifications > 0"
          class="absolute -top-1.5 -right-1.5 bg-nino text-black text-xs rounded-full px-2 py-0.5 font-bold"
        >
          {{ countNotifications }}
        </span>
      </ng-container>
    </a>

    <!-- Quejas / Reclamos -->
    <a
      pRipple
      [routerLink]="['/quejas']"
      *ngIf="auth.isLoggedIn$ | async"
      class="relative flex items-center text-gray-400 hover:text-joven cursor-pointer"
    >
      <i class="pi pi-flag text-xl"></i>
    </a>

    <!-- Botón Login -->
    <button
      *ngIf="(auth.isLoggedIn$ | async) === false"
      class="px-4 py-1.5 rounded-lg font-semibold text-black bg-joven transition duration-300 cursor-pointer"
      routerLink="/auth/login"
    >
      Login
    </button>

    <!-- Botón Perfil / Avatar -->
    <button
      *ngIf="auth.isLoggedIn$ | async"
      (click)="menu.toggle($event)"
      class="w-auto ml-0.5 h-8 rounded-full overflow-hidden cursor-pointer hover:scale-105 transition duration-200 bg-gray-700 focus:outline-none"
      aria-haspopup="true"
      aria-controls="user_menu_popup"
    >
      <img
        [src]="(auth.userImg$ | async) ?? ''"
        alt="Avatar de usuario"
        class="w-full h-full object-cover"
      />
    </button>
  </div>
</header>

<!-- SIDEBAR Y FOOTER (Logueados) -->
<div *ngIf="auth.isLoggedIn$ | async">
  <!-- Sidebar escritorio fijado a la izquierda (debajo del header) -->
  <aside
    class="hidden md:flex md:flex-col fixed top-16 left-0 h-[calc(100vh-64px)] w-56 bg-[#18181a] p-3 gap-1 z-40 border-r border-gray-800"
  >
    <div class="flex items-center gap-3 p-2 mb-2">
      <p-avatar
        image="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80"
        shape="circle"
      ></p-avatar>
      <span class="text-base font-semibold text-gray-200">Mi familia</span>
    </div>

    <a
      *ngFor="let item of itemsSidebar"
      [routerLink]="item.routerLink"
      routerLinkActive="text-yellow-400 bg-[#2e2b21] border-l-2 border-yellow-400 font-medium"
      class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-400 hover:text-white hover:bg-[#232326] transition cursor-pointer"
    >
      <i class="pi" [ngClass]="item.icon"></i>
      <span>{{ item.label }}</span>
    </a>
  </aside>

  <!-- Navigation móvil fijo abajo -->
  <nav
    class="fixed bottom-0 left-0 z-50 w-full bg-black border-t border-gray-700 px-1 pt-3 pb-4 md:hidden"
  >
    <div class="flex items-center justify-around">
      <a
        *ngFor="let item of itemsSidebar"
        [routerLink]="item.routerLink"
        routerLinkActive="!text-yellow-400"
        #rla="routerLinkActive"
        class="flex flex-col items-center justify-center text-center text-gray-400 hover:text-gray-200 transition-colors text-[7px] sm:text-sm font-medium relative cursor-pointer"
      >
        <i class="pi text-xl transition-colors" [ngClass]="item.icon"></i>
        <span class="truncate min-w-[42px] sm:max-w-[100px] transition-colors">
          {{ item.label.replace("Mi ", "").replace("Mis ", "") | titlecase }}
        </span>
        <span
          *ngIf="rla.isActive"
          class="absolute -bottom-2 w-1.5 h-1.5 bg-joven rounded-full"
        ></span>
      </a>
    </div>
  </nav>
</div>

<!-- Popups de PrimeNG -->
<p-menu
  #menu
  [model]="userItems"
  [popup]="true"
  id="user_menu_popup"
  appendTo="body"
></p-menu>
<app-cart-popup></app-cart-popup>
